name: 问题反馈 / Bug report
description: App 本体（对话、看板、日程、设置、AI、通知）出现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**请勿粘贴任何真实的账号、密码、令牌、学号或个人数据**，截图请打码。
        校园服务（树洞、校园卡、教学网……）本身的问题请到插件仓库反馈。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 期望的行为和实际的行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开对话页
        2. 输入 …
        3. 看到 …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交号
      placeholder: 设置 → 关于，或 git 提交号
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options: [Android 真机, Android 模拟器, iOS, 其他]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      placeholder: 例如 Pixel 8 · Android 16
  - type: input
    id: model
    attributes:
      label: AI 服务与模型
      placeholder: 例如 DeepSeek · deepseek-flash
  - type: textarea
    id: logs
    attributes:
      label: 截图 / 日志
      description: 可选。adb logcat 中 ReactNativeJS 相关行，已去除隐私信息

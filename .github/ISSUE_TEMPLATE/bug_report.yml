name: Bug report
description: Something is wrong in the app itself (chat, dashboard, schedule, settings, AI, notifications)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Don't paste real accounts, passwords, tokens, student IDs or other personal data**, and redact screenshots.
        Problems with a specific campus service (Treehole, campus card, courses, …) belong in the plugins repository.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the chat tab
        2. Type …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release version (e.g. 1.0.0) or git commit
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android device, Android emulator, iOS, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: e.g. Pixel 8 · Android 16
  - type: input
    id: model
    attributes:
      label: AI provider and model
      placeholder: e.g. DeepSeek · deepseek-flash
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Optional. Relevant `adb logcat` lines (ReactNativeJS), with personal data removed.

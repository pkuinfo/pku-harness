name: Question
description: Not sure how something works? Please ask in Discussions instead
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        **Questions are answered faster in [GitHub Discussions → Q&A](https://github.com/pkuinfo/pku-harness/discussions/categories/q-a)**, where other students can find the answer later. The [docs](https://pkuharness.com/en/docs) cover setup, plugins and the cloud.
        Use this form only if Discussions doesn't work for you.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried. No personal data, please.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (if relevant)
      placeholder: e.g. 1.0.20

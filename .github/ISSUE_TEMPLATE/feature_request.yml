name: Feature request
description: A new idea or improvement for the app itself (interaction, design, agent abilities)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Start from the situation, e.g. "Every morning I want to know … but today I have to …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you have in mind?
      description: Interaction, sketches and reference apps are all welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [Chat / agent, Composer and commands, Dashboard, Schedule and reminders, Settings and permissions, Design and motion, Performance, Documentation, Other]
  - type: checkboxes
    id: plugin
    attributes:
      label: Confirm
      options:
        - label: This isn't a request to connect a campus service (those go to the plugins repository).
          required: true

name: Release APK
# Builds the official, release-signed Android APK and publishes it as a GitHub release, which the
# website's download page (harness.novadiffusion.com/download) lists automatically. See
# docs/RELEASE.md.
#
# - Tag push `v<version>` (version = app.json expo.version at that commit): build with the
#   maintainers' key from the `release` environment and publish the release.
# - Manual run (Actions → Release APK → Run workflow): a dry run that builds the same APKs signed
#   with a throwaway key and uploads them as a workflow artifact; nothing is published.
#
# One APK per ABI, arm64-v8a first: real phones are arm64, and the website offers the first APK as
# the main download. A universal APK would be ~3x larger. The ABIs build in parallel (one runner
# each, ~12 min instead of ~35 in sequence); `publish` checks them together before releasing.
#
# OTA: nothing update-related is set here. app.json (runtimeVersion fingerprint, updates.url,
# code signing, channel) is used as committed, so the APK's runtime matches what the OTA publish
# resolves for the same commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: release-${{ github.ref }}
permissions:
  contents: write
  actions: read # whether CI already passed this commit

jobs:
  # Checks that run once, without secrets: the normal verify gate and the version/tag rules.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Bun pinned in .bun-version, so the binary is cached between runs. If GitHub's release
      # download fails anyway (it 504s at times), install the same version from npm instead.
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - if: steps.bun.outcome == 'failure'
        run: npm install -g "bun@$(cat .bun-version)" && bun --version
      - run: bun install --frozen-lockfile
      # CI already ran exactly these checks on this commit; don't repeat them (it's skipped for
      # docs-only commits, and then they run here).
      - name: CI result for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OK=$(gh run list -R "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" --status success --json databaseId -q 'length')
          echo "passed=$([ "${OK:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Never ship a commit that fails the normal checks.
      - if: steps.ci.outputs.passed != 'true'
        run: bun run verify

      - name: Version matches the tag; versionCode increases
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(bun -e "console.log(require('./app.json').expo.version)")
          CODE=$(bun -e "console.log(require('./app.json').expo.android?.versionCode ?? '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if ! [[ "$CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::app.json expo.android.versionCode must be a positive integer (got '$CODE')"; exit 1
          fi
          if [ "$DRY_RUN" = "false" ]; then
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::tag $TAG does not match app.json version $VERSION (bump version and versionCode in one commit, then tag that commit v$VERSION)"; exit 1
            fi
            # Android upgrades need a larger versionCode than what's installed: compare with the
            # latest published release (its notes record the versionCode).
            PREV=$(gh release view --json body -q .body 2>/dev/null | grep -oP 'versionCode \| `\K[0-9]+' || true)
            if [ -n "$PREV" ] && [ "$CODE" -le "$PREV" ]; then
              echo "::error::versionCode $CODE must be greater than the latest release's $PREV"; exit 1
            fi
          fi

  # One runner per ABI, in parallel. Release secrets (the signing key) live only in the `release`
  # environment, which only `v*` tags may use; dry runs never see them. One approval of the run
  # covers all three jobs.
  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.event_name == 'push' && 'release' || 'apk-dry-run' }}
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - if: steps.bun.outcome == 'failure'
        run: npm install -g "bun@$(cat .bun-version)" && bun --version
      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # android/ is generated from the committed app.json and config plugins (CNG).
      - run: bunx expo prebuild --platform android --no-install --clean

      # The wrapper fetches Gradle from services.gradle.org, which 504s at times (it failed two
      # approved v1.0.2 runs). Fetch it up front with retries so Build finds it cached.
      - name: Gradle distribution
        working-directory: android
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            ./gradlew --version --no-daemon >/dev/null && exit 0
            echo "::warning::Gradle download failed (attempt $i), retrying in $((i * 30))s"
            sleep $((i * 30))
          done
          exit 1

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PKU_HARNESS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PKU_HARNESS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PKU_HARNESS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PKU_HARNESS_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ "$DRY_RUN" = "true" ]; then
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -v -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias dryrun \
              -keyalg RSA -keysize 4096 -validity 2 -dname "CN=PKU Harness dry run" >/dev/null 2>&1
            { echo "PKU_HARNESS_KEYSTORE_PASSWORD=$PASS"; echo "PKU_HARNESS_KEY_PASSWORD=$PASS"; echo "PKU_HARNESS_KEY_ALIAS=dryrun"; } >> "$GITHUB_ENV"
          else
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::the release environment has no signing key (PKU_HARNESS_KEYSTORE_BASE64 / _KEYSTORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD); see docs/RELEASE.md"
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            { echo "PKU_HARNESS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; echo "PKU_HARNESS_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"; echo "PKU_HARNESS_KEY_ALIAS=$KEY_ALIAS"; } >> "$GITHUB_ENV"
          fi
          echo "PKU_HARNESS_KEYSTORE=$KS" >> "$GITHUB_ENV"

      # Dependency downloads fail at times (Maven Central redirects some Kotlin jars to GitHub
      # releases, which 504s): more retries per request, and the build retried with what it fetched.
      # The runner has 4 cores and 16 GB: R8 (minify, ~4 min) is the slowest task and is starved on
      # the template's 2 GB heap. lintVitalRelease repeats what CI's lint already covers.
      - name: Build
        working-directory: android
        env:
          ABI: ${{ matrix.abi }}
        run: |
          mkdir -p ../dist
          ok=
          for i in 1 2 3 4; do
            if ./gradlew assembleRelease -PreactNativeArchitectures="$ABI" --max-workers=4 --no-daemon -x lintVitalRelease \
              -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" \
              -Dorg.gradle.internal.repository.max.retries=8 -Dorg.gradle.internal.repository.initial.backoff=2000; then
              ok=1; break
            fi
            echo "::warning::$ABI build failed (attempt $i), retrying in $((i * 60))s"
            sleep $((i * 60))
          done
          [ -n "$ok" ] || exit 1
          cp app/build/outputs/apk/release/app-release.apk "../dist/pku-harness-${{ needs.check.outputs.version }}-$ABI.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          path: dist/*.apk
          retention-days: 1

  # Checks the three APKs together (release key, one ABI each, same certificate and runtime
  # fingerprint) and publishes them. No secrets here.
  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
      TAG: ${{ github.ref_name }}
      ABIS: arm64-v8a armeabi-v7a x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      - name: Inspect
        id: apk
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=; FP=
          : > dist/rows.md
          for ABI in $ABIS; do
            NAME="pku-harness-${{ needs.check.outputs.version }}-$ABI.apk"
            "$APKSIGNER" verify --print-certs "dist/$NAME" > dist/certs.txt
            cat dist/certs.txt
            if grep -q "CN=Android Debug" dist/certs.txt; then
              echo "::error::$NAME is signed with the debug key"; exit 1
            fi
            # Each APK must carry exactly its own ABI's native libraries.
            LIBS=$(unzip -Z1 "dist/$NAME" 'lib/*' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            if [ "$LIBS" != "$ABI " ]; then
              echo "::error::$NAME has native libraries for '$LIBS', expected '$ABI'"; exit 1
            fi
            THIS_CERT=$(grep -m1 "certificate SHA-256 digest" dist/certs.txt | awk '{print $NF}')
            THIS_FP=$(unzip -p "dist/$NAME" assets/fingerprint 2>/dev/null || true)
            # Dry runs sign each ABI with its own throwaway key, so only releases compare certificates.
            if [ -n "$CERT" ] && { { [ "$DRY_RUN" = "false" ] && [ "$THIS_CERT" != "$CERT" ]; } || [ "$THIS_FP" != "$FP" ]; }; then
              echo "::error::$NAME differs in signing certificate or runtime fingerprint from the other APKs"; exit 1
            fi
            CERT=$THIS_CERT; FP=$THIS_FP
            SHA=$(sha256sum "dist/$NAME" | awk '{print $1}')
            echo "| \`$NAME\` | \`$SHA\` |" >> dist/rows.md
          done
          rm dist/certs.txt
          { echo "cert=$CERT"; echo "fingerprint=$FP"; } >> "$GITHUB_OUTPUT"

      - name: Dry run artifact
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pku-harness-${{ needs.check.outputs.version }}-apks
          path: dist/*.apk
          retention-days: 3

      - name: Publish release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FIRST="pku-harness-${{ needs.check.outputs.version }}-${ABIS%% *}.apk"
          # docs/releases/<version>.md holds the "## 更新内容" / "## What's new" bullets the in-app update sheet shows.
          cat > notes.md <<EOF
          PKU Harness ${TAG} for Android 7.0+. Most phones need \`arm64-v8a\`; \`armeabi-v7a\` is for
          older 32-bit phones and \`x86_64\` for emulators and x86 devices.

          $(cat "docs/releases/${{ needs.check.outputs.version }}.md" 2>/dev/null)

          | | |
          |---|---|
          | versionCode | \`${{ needs.check.outputs.code }}\` |
          | Signing certificate SHA-256 | \`${{ steps.apk.outputs.cert }}\` |
          | Runtime fingerprint (OTA) | \`${{ steps.apk.outputs.fingerprint }}\` |
          | Commit | ${GITHUB_SHA} |

          | APK | SHA-256 |
          |---|---|
          $(cat dist/rows.md)

          Built by GitHub Actions from this tag's commit. Every release is signed with the same key:
          an install signed differently (e.g. a debug build from source) must be uninstalled first.
          Later JS and plugin updates arrive over the air, signed by the maintainers.
          EOF
          # The website offers a release's first asset as the main download: upload arm64 alone first.
          gh release create "$TAG" "dist/$FIRST" --title "PKU Harness ${TAG}" --notes-file notes.md --verify-tag
          for f in dist/*.apk; do [ "$f" = "dist/$FIRST" ] || gh release upload "$TAG" "$f"; done

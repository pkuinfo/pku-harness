name: CI
on:
  push:
    branches: [main]
    # Markdown and docs alone can't break the app; docs/legal feeds a generated file and its test.
    paths: ['**', '!**/*.md', '!docs/**', 'docs/legal/**']
  pull_request:
    paths: ['**', '!**/*.md', '!docs/**', 'docs/legal/**']

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # Bun pinned in .bun-version, so the binary is cached between runs. If GitHub's release
      # download fails anyway (it 504s at times), install the same version from npm instead.
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
        with:
          bun-version-file: .bun-version
      - if: steps.bun.outcome == 'failure'
        run: npm install -g "bun@$(cat .bun-version)" && bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

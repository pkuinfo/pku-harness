plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.campushttp'
version = '0.1.0'

android {
  namespace "expo.modules.campushttp"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // React Native already ships OkHttp 4; compile against the same major version.
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

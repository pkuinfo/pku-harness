plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.docreader'
version = '0.1.0'

android {
  namespace "expo.modules.docreader"
  defaultConfig {
    consumerProguardFiles "consumer-rules.pro"
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // PDF text on Android 14 and older (PdfRenderer only reads text from Android 15).
  implementation "com.tom-roush:pdfbox-android:2.0.27.0"
  testImplementation "junit:junit:4.13.2"
  testImplementation "net.sf.kxml:kxml2:2.3.0"
}

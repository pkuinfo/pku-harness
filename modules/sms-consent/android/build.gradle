plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smsconsent'
version = '0.1.0'

android {
  namespace "expo.modules.smsconsent"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // SMS User Consent API (Google Play services): reads one incoming SMS after the user taps
  // Allow in a system sheet; no READ_SMS / RECEIVE_SMS permission.
  implementation "com.google.android.gms:play-services-auth-api-phone:18.1.0"
}
